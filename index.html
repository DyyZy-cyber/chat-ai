<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nexus AI | Premium Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0a0f, #030305);
            min-height: 100vh;
            overflow: hidden;
            color: #ffffff;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(88, 28, 135, 0.15) 0%, rgba(0,0,0,0) 70%);
            animation: rotateBg 30s linear infinite;
        }

        @keyframes rotateBg {
            0% { transform: translate(-25%, -25%) rotate(0deg); }
            100% { transform: translate(-25%, -25%) rotate(360deg); }
        }

        .glow-orb {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.2), transparent);
            border-radius: 50%;
            filter: blur(80px);
            animation: floatOrb 12s ease-in-out infinite;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            50% { transform: translate(5%, 5%) scale(1.1); opacity: 0.7; }
        }

        /* Main App Container */
        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            height: 100vh;
            width: 100%;
            backdrop-filter: blur(2px);
        }

        /* Sidebar Premium */
        .sidebar {
            width: 280px;
            background: rgba(10, 10, 20, 0.7);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(139, 92, 246, 0.2);
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                z-index: 100;
                height: 100%;
                transition: left 0.3s ease;
            }
            .sidebar.open {
                left: 0;
            }
            .menu-toggle {
                display: block !important;
            }
        }

        .sidebar-header {
            padding: 30px 24px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo i {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 28px;
        }

        .sidebar-menu {
            flex: 1;
            padding: 24px;
        }

        .menu-item {
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            color: rgba(255,255,255,0.7);
        }

        .menu-item:hover {
            background: rgba(139, 92, 246, 0.15);
            color: white;
            transform: translateX(5px);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        .menu-item.active {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.2), transparent);
            border-left: 3px solid #a855f7;
            color: white;
        }

        /* Main Chat Area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(5, 5, 10, 0.4);
            backdrop-filter: blur(10px);
        }

        /* Header */
        .chat-header {
            padding: 20px 32px;
            background: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .menu-toggle:hover {
            transform: scale(1.1);
        }

        .ai-status {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 8px #10b981;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border-radius: 10px;
        }

        /* Chat Bubbles */
        .message {
            display: flex;
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 70%;
            padding: 14px 20px;
            border-radius: 24px;
            font-size: 15px;
            line-height: 1.5;
            transition: all 0.3s;
            word-wrap: break-word;
        }

        .message.user .bubble {
            background: rgba(30, 30, 40, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px 24px 4px 24px;
            color: #f0f0f0;
        }

        .message.ai .bubble {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(59, 130, 246, 0.2));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 24px 24px 24px 4px;
            color: white;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
        }

        /* Loading Animation */
        .typing-indicator {
            display: flex;
            gap: 8px;
            padding: 14px 20px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(59, 130, 246, 0.2));
            backdrop-filter: blur(12px);
            border-radius: 24px;
            width: fit-content;
            border: 1px solid rgba(139, 92, 246, 0.4);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #a855f7;
            border-radius: 50%;
            animation: typing 1.4s infinite;
            box-shadow: 0 0 6px #a855f7;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* Input Area */
        .input-area {
            padding: 20px 32px;
            background: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(139, 92, 246, 0.2);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 32px;
            padding: 8px 8px 8px 20px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            transition: all 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
            transform: scale(1.01);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            padding: 12px 0;
            resize: none;
            outline: none;
            max-height: 120px;
        }

        textarea::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .send-btn {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* Footer Copyright */
        .copyright {
            text-align: center;
            padding: 12px;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            border-top: 1px solid rgba(139, 92, 246, 0.1);
            background: rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            .chat-header, .messages-container, .input-area {
                padding-left: 20px;
                padding-right: 20px;
            }
            .bubble {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
<div class="bg-animation">
    <div class="glow-orb" style="top: -200px; right: -200px;"></div>
    <div class="glow-orb" style="bottom: -200px; left: -200px; animation-delay: -6s;"></div>
</div>

<div class="app-container">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <span>NEXUS AI</span>
            </div>
        </div>
        <div class="sidebar-menu">
            <div class="menu-item active">
                <i class="fas fa-comment-dots"></i>
                <span>New Chat</span>
            </div>
            <div class="menu-item">
                <i class="fas fa-history"></i>
                <span>History</span>
            </div>
            <div class="menu-item">
                <i class="fas fa-cog"></i>
                <span>Preferences</span>
            </div>
        </div>
    </div>

    <div class="chat-main">
        <div class="chat-header">
            <div class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </div>
            <div class="ai-status">
                <div class="status-dot"></div>
                <span>Nexus AI • Online</span>
            </div>
            <div><i class="fas fa-robot" style="font-size: 24px; opacity: 0.7;"></i></div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="message ai">
                <div class="bubble">
                    ✨ Halo! Saya Nexus AI, asisten cerdas dengan gaya santai, cerdas, dan sedikit sarkastik. Ada yang bisa dibantu? 😏
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" rows="1" placeholder="Ketik pesanmu... (Enter untuk kirim)"></textarea>
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
        <div class="copyright">
            © Dyy Loyd • Nexus AI Premium
        </div>
    </div>
</div>

<script>
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');

    let isLoading = false;

    menuToggle.addEventListener('click', () => {
        sidebar.classList.toggle('open');
    });

    function autoScroll() {
        messagesContainer.scrollTo({
            top: messagesContainer.scrollHeight,
            behavior: 'smooth'
        });
    }

    function addMessage(content, isUser) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = content.replace(/\n/g, '<br>');
        messageDiv.appendChild(bubble);
        messagesContainer.appendChild(messageDiv);
        autoScroll();
        return messageDiv;
    }

    function showTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message ai';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `
            <div class="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        `;
        messagesContainer.appendChild(typingDiv);
        autoScroll();
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
    }

    async function sendMessage() {
        if (isLoading) return;
        const userMessage = messageInput.value.trim();
        if (!userMessage) return;

        addMessage(userMessage, true);
        messageInput.value = '';
        messageInput.style.height = 'auto';

        isLoading = true;
        showTypingIndicator();

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userMessage })
            });

            if (!response.ok) throw new Error('Network error');
            const data = await response.json();
            removeTypingIndicator();
            addMessage(data.reply, false);
        } catch (error) {
            removeTypingIndicator();
            addMessage('⚠️ Gangguan koneksi. Coba lagi nanti ya!', false);
            console.error(error);
        } finally {
            isLoading = false;
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    autoScroll();
</script>
</body>
</html>
